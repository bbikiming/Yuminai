<?xml version="1.0" encoding="UTF-8"?>
<!--
  Yuminai App Icon — ADR-086 (Codex 협업 디자인)

  컨셉: "Convergence + Code" — 멀티 에이전트 (Y 형태로 수렴) + 개발 환경 (< > arrows + circuit)

  디자인 요소:
  - 흰색 squircle 배경 (macOS Big Sur+ spec)
  - 보라(#7C3AED) → 파랑(#3B82F6) 그라디언트 Y 모양 (Yuminai의 Y + multi-agent → unified)
  - 상단 삼각형 액센트 (포커스 / "play" mode)
  - 좌우 < > arrows (CLI / code editor 메타포)
  - Y 둘레 원형 outline + 작은 dot들 (orbital connections)
  - subtle circuit lines (밑변 + 측면)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Y 그라디언트 (보라 → 파랑) -->
    <linearGradient id="yGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#5B5DEF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Triangle 그라디언트 (보라 짙은 → 보라 밝은) -->
    <linearGradient id="triangleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Circle outline 그라디언트 -->
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Subtle Y shadow -->
    <filter id="yShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. White squircle background (Apple icon spec) -->
  <rect x="100" y="100" width="824" height="824" rx="180" ry="180" fill="#FFFFFF"/>

  <!-- 2. Subtle inner border (1px stroke for definition) -->
  <rect x="100" y="100" width="824" height="824" rx="180" ry="180"
        fill="none" stroke="#E5E7EB" stroke-width="2"/>

  <!-- 3. Outer circle outline (orbital ring) -->
  <circle cx="512" cy="540" r="280" fill="none"
          stroke="url(#circleGradient)" stroke-width="6" opacity="0.45"/>

  <!-- 4. Orbital dots (4개, 12/3/6/9 방향) -->
  <circle cx="512" cy="260" r="10" fill="#7C3AED" opacity="0.85"/>
  <circle cx="792" cy="540" r="10" fill="#5B5DEF" opacity="0.85"/>
  <circle cx="512" cy="820" r="10" fill="#3B82F6" opacity="0.85"/>
  <circle cx="232" cy="540" r="10" fill="#5B5DEF" opacity="0.85"/>

  <!-- 5. Top triangle accent ("play" / focus mode) -->
  <g filter="url(#yShadow)">
    <polygon points="512,210 472,290 552,290" fill="url(#triangleGradient)"/>
  </g>

  <!-- 6. Y shape (보라 → 파랑 그라디언트) — 멀티에이전트가 한 점으로 수렴 -->
  <g filter="url(#yShadow)">
    <!-- Y 좌측 가지 -->
    <path d="M 360,340 L 512,540 L 512,720 L 484,720 L 484,548 L 332,348 Z"
          fill="url(#yGradient)"/>
    <!-- Y 우측 가지 -->
    <path d="M 664,340 L 512,540 L 512,720 L 540,720 L 540,548 L 692,348 Z"
          fill="url(#yGradient)"/>
    <!-- Y 줄기 (cleanup, 좌우 path와 살짝 겹쳐서 끊김 방지) -->
    <rect x="484" y="540" width="56" height="200" fill="url(#yGradient)" rx="8"/>
  </g>

  <!-- 7. Left arrow ("<") — CLI / code editor 메타포 -->
  <g stroke="url(#yGradient)" stroke-width="22" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <polyline points="284,470 224,540 284,610"/>
  </g>

  <!-- 8. Right arrow (">") -->
  <g stroke="url(#yGradient)" stroke-width="22" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <polyline points="740,470 800,540 740,610"/>
  </g>

  <!-- 9. Subtle circuit lines (밑변 — connection metaphor) -->
  <g stroke="#A78BFA" stroke-width="3" fill="none" opacity="0.35">
    <!-- 좌측 circuit -->
    <path d="M 200,750 L 260,750 L 280,770 L 340,770"/>
    <circle cx="200" cy="750" r="4" fill="#A78BFA"/>
    <circle cx="340" cy="770" r="4" fill="#A78BFA"/>
    <!-- 우측 circuit -->
    <path d="M 824,750 L 764,750 L 744,770 L 684,770"/>
    <circle cx="824" cy="750" r="4" fill="#60A5FA"/>
    <circle cx="684" cy="770" r="4" fill="#60A5FA"/>
  </g>

  <!-- 10. Top circuit lines (subtle, suggesting code flowing in) -->
  <g stroke="#A78BFA" stroke-width="3" fill="none" opacity="0.30">
    <path d="M 380,260 L 380,220 L 420,220"/>
    <path d="M 644,260 L 644,220 L 604,220"/>
  </g>
</svg>
