<?xml version="1.0" encoding="UTF-8"?>
<!--
  ADR-149 — DMG installer 배경 (재디자인).
  크기: 800×500 (Finder window bounds {200,100,800,500} = 600×400 viewable).
  좌측: Yuminai.app 자리 (150, 200) — 큰 아이콘 + 라벨
  우측: Applications alias (450, 200) — 폴더 아이콘 + 라벨
  중앙: → 화살표 + "여기로 드래그" 안내
  하단: install.command + 첫 실행 안내 카드
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bg" cx="0.4" cy="0.3" r="0.85">
      <stop offset="0%"   stop-color="#1E40AF"/>
      <stop offset="40%"  stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="logoGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="topHL" cx="0.25" cy="0.1" r="0.4">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feFlood flood-color="#000000" flood-opacity="0.4"/>
      <feComposite in2="off" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- 별 디테일 -->
  <g fill="#FFFFFF">
    <circle cx="60"  cy="80"  r="1.5" opacity="0.8"/>
    <circle cx="140" cy="50"  r="1"   opacity="0.6"/>
    <circle cx="720" cy="70"  r="1.5" opacity="0.8"/>
    <circle cx="780" cy="120" r="1"   opacity="0.6"/>
    <circle cx="40"  cy="420" r="1.2" opacity="0.7"/>
    <circle cx="760" cy="440" r="1.2" opacity="0.7"/>
  </g>

  <!-- 좌상단 로고 -->
  <g transform="translate(50 50)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#1E1B4B"/>
    <circle cx="28" cy="28" r="32" fill="url(#logoGlow)"/>
    <g stroke="url(#logoY)" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="14" y1="14" x2="28" y2="32"/>
      <line x1="42" y1="14" x2="28" y2="32"/>
      <line x1="28" y1="32" x2="28" y2="46"/>
    </g>
    <circle cx="28" cy="32" r="3" fill="#FFFFFF"/>
    <text x="72" y="24" font-family="-apple-system, system-ui, sans-serif"
          font-size="18" font-weight="700" fill="#FFFFFF">Yuminai</text>
    <text x="72" y="44" font-family="-apple-system, system-ui, sans-serif"
          font-size="11" fill="#94A3B8">v1.1.0 · Vibe Coding for macOS</text>
  </g>

  <!-- 중앙 화살표 -->
  <g transform="translate(300 200)">
    <line x1="0" y1="0" x2="120" y2="0"
          stroke="url(#arrowGrad)" stroke-width="6" stroke-linecap="round" filter="url(#softShadow)"/>
    <polygon points="115,-12 135,0 115,12" fill="url(#arrowGrad)" filter="url(#softShadow)"/>
    <text x="60" y="-30" text-anchor="middle"
          font-family="-apple-system, system-ui, sans-serif"
          font-size="13" font-weight="600" fill="#FFFFFF" opacity="0.95">
      여기로 드래그
    </text>
    <text x="60" y="32" text-anchor="middle"
          font-family="-apple-system, system-ui, sans-serif"
          font-size="11" fill="#94A3B8">
      Drag to install
    </text>
  </g>

  <!-- 좌/우 자리 텍스트 -->
  <g opacity="0.5">
    <text text-anchor="middle" x="150" y="285"
          font-family="-apple-system, system-ui, sans-serif"
          font-size="10" fill="#64748B">앱 (드래그 시작)</text>
    <text text-anchor="middle" x="450" y="285"
          font-family="-apple-system, system-ui, sans-serif"
          font-size="10" fill="#64748B">Applications</text>
  </g>

  <!-- 하단 카드 -->
  <g transform="translate(50 360)">
    <rect x="0" y="0" width="700" height="100" rx="14"
          fill="#1E1B4B" opacity="0.7" filter="url(#softShadow)"/>
    <rect x="0" y="0" width="700" height="100" rx="14"
          fill="none" stroke="#22D3EE" stroke-width="0.5" opacity="0.3"/>

    <!-- 좌측 자동 -->
    <g transform="translate(20 24)">
      <circle cx="12" cy="12" r="12" fill="#10B981"/>
      <text x="12" y="17" text-anchor="middle"
            font-family="-apple-system, sans-serif" font-size="14" font-weight="700"
            fill="#FFFFFF">⚡</text>
      <text x="36" y="11" font-family="-apple-system, sans-serif"
            font-size="13" font-weight="600" fill="#FFFFFF">자동 설치 (권장)</text>
      <text x="36" y="29" font-family="-apple-system, sans-serif"
            font-size="11" fill="#CBD5E1">
        install.command 더블클릭 → 권한 자동 + 앱 실행
      </text>
      <text x="36" y="46" font-family="-apple-system, sans-serif"
            font-size="10" fill="#94A3B8">
        Gatekeeper 차단 우회 자동
      </text>
    </g>

    <line x1="350" y1="14" x2="350" y2="86" stroke="#475569" stroke-width="0.5" opacity="0.5"/>

    <!-- 우측 수동 -->
    <g transform="translate(370 24)">
      <circle cx="12" cy="12" r="12" fill="#F59E0B"/>
      <text x="12" y="17" text-anchor="middle"
            font-family="-apple-system, sans-serif" font-size="14" font-weight="700"
            fill="#FFFFFF">①</text>
      <text x="36" y="11" font-family="-apple-system, sans-serif"
            font-size="13" font-weight="600" fill="#FFFFFF">수동 설치</text>
      <text x="36" y="29" font-family="-apple-system, sans-serif"
            font-size="11" fill="#CBD5E1">
        Yuminai.app 우클릭 → 열기 → "그래도 열기"
      </text>
      <text x="36" y="46" font-family="-apple-system, sans-serif"
            font-size="10" fill="#94A3B8">
        시스템 설정 → 보안 → 차단됨 → 그래도 열기
      </text>
    </g>
  </g>

  <rect width="800" height="500" fill="url(#topHL)"/>
</svg>
