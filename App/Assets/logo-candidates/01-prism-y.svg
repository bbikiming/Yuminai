<?xml version="1.0" encoding="UTF-8"?>
<!--
  후보 #1: PRISM Y
  컨셉: 삼각 프리즘 + Y 분기. Claude/Codex 두 갈래 빛으로 갈라지는 창의성.
  팔레트: Indigo → Cyan 그라디언트 + 흰 squircle
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- squircle 배경 -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- 삼각형 프리즘 (회전 -15도) -->
  <g transform="translate(512 512) rotate(-15)">
    <polygon points="0,-280 240,140 -240,140" fill="url(#prism)" opacity="0.95"/>

    <!-- Y 분기 라인 (흰색) -->
    <g stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" fill="none">
      <line x1="0" y1="-160" x2="0" y2="0"/>
      <line x1="0" y1="0" x2="-110" y2="120"/>
      <line x1="0" y1="0" x2="110" y2="120"/>
    </g>
  </g>
</svg>
