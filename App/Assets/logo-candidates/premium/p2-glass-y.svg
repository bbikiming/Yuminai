<?xml version="1.0" encoding="UTF-8"?>
<!--
  PREMIUM #2: GLASS Y (글래스모피즘)
  컨셉: 백라이트 글래스 + 굴절 + 깊이.
  - 배경: 다크 + soft gradient
  - Y: 반투명 glass + edge highlight + colored backlight
  - 모서리 노드: 발광 + lens flare
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgP2" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="40%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Backlight (Y 뒤 큰 발광) -->
    <radialGradient id="backlight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass material (반투명) -->
    <linearGradient id="glassY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Edge highlight -->
    <linearGradient id="edgeHL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Top hl on squircle -->
    <radialGradient id="squircleHL" cx="0.3" cy="0.15" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom shadow -->
    <linearGradient id="bottomShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Shadow filter under Y -->
    <filter id="ydropP2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="20" result="off"/>
      <feFlood flood-color="#0891B2" flood-opacity="0.6"/>
      <feComposite in2="off" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Lens flare radial -->
    <radialGradient id="lensflare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#22D3EE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 배경 -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bgP2)"/>

  <!-- Backlight halo (Y 뒤) -->
  <ellipse cx="512" cy="540" rx="380" ry="320" fill="url(#backlight)"/>

  <!-- 미세 그리드 (back layer) -->
  <g stroke="#22D3EE" stroke-width="0.6" opacity="0.10">
    <line x1="0" y1="200" x2="1024" y2="200"/>
    <line x1="0" y1="400" x2="1024" y2="400"/>
    <line x1="0" y1="600" x2="1024" y2="600"/>
    <line x1="0" y1="800" x2="1024" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1024"/>
    <line x1="400" y1="0" x2="400" y2="1024"/>
    <line x1="600" y1="0" x2="600" y2="1024"/>
    <line x1="800" y1="0" x2="800" y2="1024"/>
  </g>

  <!-- Y backlight stroke (큰 cyan glow) -->
  <g opacity="0.6">
    <line x1="320" y1="320" x2="512" y2="540"
          stroke="#22D3EE" stroke-width="100" stroke-linecap="round" filter="url(#ydropP2)"/>
    <line x1="704" y1="320" x2="512" y2="540"
          stroke="#22D3EE" stroke-width="100" stroke-linecap="round" filter="url(#ydropP2)"/>
    <line x1="512" y1="540" x2="512" y2="780"
          stroke="#22D3EE" stroke-width="100" stroke-linecap="round" filter="url(#ydropP2)"/>
  </g>

  <!-- Y main (glass) -->
  <g>
    <line x1="320" y1="320" x2="512" y2="540"
          stroke="url(#glassY)" stroke-width="60" stroke-linecap="round"/>
    <line x1="704" y1="320" x2="512" y2="540"
          stroke="url(#glassY)" stroke-width="60" stroke-linecap="round"/>
    <line x1="512" y1="540" x2="512" y2="780"
          stroke="url(#glassY)" stroke-width="60" stroke-linecap="round"/>
  </g>

  <!-- Y edge highlight (top thin) -->
  <g opacity="0.85">
    <line x1="320" y1="320" x2="512" y2="540"
          stroke="url(#edgeHL)" stroke-width="60" stroke-linecap="round"/>
    <line x1="704" y1="320" x2="512" y2="540"
          stroke="url(#edgeHL)" stroke-width="60" stroke-linecap="round"/>
  </g>

  <!-- 끝 노드 + lens flare -->
  <g>
    <circle cx="320" cy="320" r="48" fill="url(#lensflare)" opacity="0.9"/>
    <circle cx="320" cy="320" r="22" fill="#FFFFFF"/>

    <circle cx="704" cy="320" r="48" fill="url(#lensflare)" opacity="0.9"/>
    <circle cx="704" cy="320" r="22" fill="#FFFFFF"/>

    <circle cx="512" cy="780" r="48" fill="url(#lensflare)" opacity="0.9"/>
    <circle cx="512" cy="780" r="22" fill="#FFFFFF"/>
  </g>

  <!-- 중앙 합류 코어 (lens flare 큰 것) -->
  <circle cx="512" cy="540" r="100" fill="url(#lensflare)" opacity="0.9"/>
  <circle cx="512" cy="540" r="56" fill="#FFFFFF"/>
  <circle cx="512" cy="540" r="32" fill="#22D3EE"/>
  <circle cx="512" cy="540" r="14" fill="#FFFFFF"/>

  <!-- Top hl on squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#squircleHL)"/>

  <!-- Bottom subtle shadow -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bottomShadow)" opacity="0.3"/>
</svg>
