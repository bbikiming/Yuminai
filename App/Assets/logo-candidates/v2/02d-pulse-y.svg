<?xml version="1.0" encoding="UTF-8"?>
<!--
  후보 #2d: PULSE Y
  컨셉: Y 라인을 흐르는 펄스 / 데이터 패킷. 라인은 그라디언트로 흐름 표현.
  팔레트: 다크 + 그라디언트 펄스 (시안 → 핑크)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg2d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="pulseLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="pulseRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="pulseStem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bg2d)"/>

  <!-- 좌측 펄스 라인 -->
  <line x1="280" y1="280" x2="512" y2="540"
        stroke="url(#pulseLeft)" stroke-width="44" stroke-linecap="round"/>
  <!-- 우측 펄스 라인 -->
  <line x1="744" y1="280" x2="512" y2="540"
        stroke="url(#pulseRight)" stroke-width="44" stroke-linecap="round"/>
  <!-- 줄기 펄스 -->
  <line x1="512" y1="540" x2="512" y2="800"
        stroke="url(#pulseStem)" stroke-width="44" stroke-linecap="round"/>

  <!-- Y 라인 외광 (전체) -->
  <g stroke="#22D3EE" stroke-width="80" stroke-linecap="round" fill="none" opacity="0.10">
    <line x1="280" y1="280" x2="512" y2="540"/>
    <line x1="744" y1="280" x2="512" y2="540"/>
  </g>
  <line x1="512" y1="540" x2="512" y2="800"
        stroke="#F472B6" stroke-width="80" stroke-linecap="round" opacity="0.10"/>

  <!-- 펄스 점 (라인 위 흐르는 packet) -->
  <g>
    <circle cx="396" cy="410" r="14" fill="#FFFFFF"/>
    <circle cx="396" cy="410" r="22" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.6"/>

    <circle cx="628" cy="410" r="14" fill="#FFFFFF"/>
    <circle cx="628" cy="410" r="22" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.6"/>

    <circle cx="512" cy="670" r="14" fill="#FFFFFF"/>
    <circle cx="512" cy="670" r="22" fill="none" stroke="#F472B6" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- 끝 노드 -->
  <g fill="#FFFFFF">
    <circle cx="280" cy="280" r="20"/>
    <circle cx="744" cy="280" r="20"/>
    <circle cx="512" cy="800" r="20"/>
  </g>

  <!-- 중앙 합류 (큰 노드) -->
  <circle cx="512" cy="540" r="50" fill="#FFFFFF"/>
  <circle cx="512" cy="540" r="78" fill="none" stroke="#22D3EE" stroke-width="4" opacity="0.7"/>
</svg>
