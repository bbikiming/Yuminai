<?xml version="1.0" encoding="UTF-8"?>
<!--
  후보 #2e: ORBITAL Y
  컨셉: 동심원 궤도 + Y 회로. 우주/AI/원자 모티프.
  팔레트: 다크 + 시안 궤도 + 핑크 입자
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg2e" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="core2e" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bg2e)"/>

  <!-- 동심 궤도 (3개) -->
  <g fill="none" stroke="#22D3EE" opacity="0.4">
    <circle cx="512" cy="540" r="140" stroke-width="1.5"/>
    <circle cx="512" cy="540" r="220" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="512" cy="540" r="320" stroke-width="1.5" stroke-dasharray="2 8"/>
  </g>

  <!-- 회전 궤도 (45도 기울인 ellipse) -->
  <g fill="none" stroke="#F472B6" opacity="0.5">
    <ellipse cx="512" cy="540" rx="280" ry="120" stroke-width="2" transform="rotate(-25 512 540)"/>
    <ellipse cx="512" cy="540" rx="280" ry="120" stroke-width="2" transform="rotate(25 512 540)"/>
  </g>

  <!-- Y 메인 라인 (배경 위 강조) -->
  <g stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" fill="none">
    <line x1="320" y1="320" x2="512" y2="540"/>
    <line x1="704" y1="320" x2="512" y2="540"/>
    <line x1="512" y1="540" x2="512" y2="800"/>
  </g>
  <!-- Y 발광 -->
  <g stroke="#22D3EE" stroke-width="68" stroke-linecap="round" fill="none" opacity="0.20">
    <line x1="320" y1="320" x2="512" y2="540"/>
    <line x1="704" y1="320" x2="512" y2="540"/>
    <line x1="512" y1="540" x2="512" y2="800"/>
  </g>

  <!-- 궤도 입자 (작은 점들) -->
  <g fill="#F472B6">
    <circle cx="652" cy="540" r="10"/>
    <circle cx="372" cy="540" r="10"/>
    <circle cx="700" cy="380" r="8" opacity="0.7"/>
  </g>
  <g fill="#FBBF24">
    <circle cx="730" cy="700" r="8"/>
    <circle cx="290" cy="700" r="8"/>
  </g>

  <!-- 중앙 코어 (원자 핵) -->
  <circle cx="512" cy="540" r="80" fill="url(#core2e)"/>
  <circle cx="512" cy="540" r="44" fill="#FFFFFF"/>

  <!-- 끝 노드 -->
  <g fill="#FFFFFF">
    <circle cx="320" cy="320" r="20"/>
    <circle cx="704" cy="320" r="20"/>
    <circle cx="512" cy="800" r="20"/>
  </g>
</svg>
